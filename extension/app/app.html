<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyTube SEO</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="mt-root">
    <div id="app">
      <aside id="sidebar">
        <a id="brand" href="#/">
          <img src="../icons/icon-48.png" alt="" width="28" height="28" />
          <span>MyTube <strong>SEO</strong></span>
        </a>
        <nav id="nav"></nav>
      </aside>
      <div id="main">
        <header id="topbar">
          <button id="menu-toggle" class="mt-btn ghost" type="button" aria-label="Menu">☰</button>
          <form id="quick-search">
            <input id="quick-input" class="mt-input" type="search" placeholder="Analyser un mot-clé, une vidéo (URL) ou une chaîne (@handle)…" autocomplete="off" />
          </form>
          <div id="topbar-right"></div>
        </header>
        <main id="view"></main>
      </div>
    </div>
    <script src="../lib/core.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/text.js"></script>
    <script src="../lib/seo.js"></script>
    <script src="../lib/keyword.js"></script>
    <script src="../lib/youtube.js"></script>
    <script src="../lib/ytapi.js"></script>
    <script src="../lib/oauth.js"></script>
    <script src="../lib/translate.js"></script>
    <script src="../lib/ai.js"></script>
    <script src="../lib/research.js"></script>
    <script src="../lib/widgets.js"></script>
    <script src="ui.js"></script>
    <script src="views/home.js"></script>
    <script src="views/keywords.js"></script>
    <script src="views/seostudio.js"></script>
    <script src="views/tags.js"></script>
    <script src="views/videolytics.js"></script>
    <script src="views/channel.js"></script>
    <script src="views/tracking.js"></script>
    <script src="views/create.js"></script>
    <script src="views/thumbnails.js"></script>
    <script src="views/comments.js"></script>
    <script src="views/manage.js"></script>
    <script src="views/analytics.js"></script>
    <script src="views/settings.js"></script>
    <script src="main.js"></script>
  </body>
</html>
